[core]
	engine = pg
	plan_file = sqitch.plan
	top_dir = .
[engine "pg"]
	registry = sqitch
# Targets are deliberately not set here. Pass one on the command line or via
# SQITCH_TARGET=db:pg://schemaverse@host/schemaverse (docker/compose.yml does this),
# or put personal defaults in ~/.sqitch/sqitch.conf.
